<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bogdan Zmeul">
    <title>Task1</title>
</head>

<body>

    <article>
        <header>
            <h3>Form for teachers</h3>
        </header>

        <form action="#" method="post">

            <label for="name">Enter your name:</label>
            <input type="text" name="name" placeholder="Enter your name"><br><br>

            <label for="gender">Your gender:</label>
            <select name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <br><br>

            <label for="date">Enter your birthdate:</label>
            <input type="date" name="birthdate"><br><br>

            <label for="email">Enter your email:</label>
            <input type="email" name="email" placeholder="example@gmail.com"><br><br>

            <label for="tel">Enter your phone number:</label>
            <input type="tel" name="phone" placeholder="+38(099)999-99-99"><br><br>

            <label for="color">Choose your color:</label>
            <input type="color" name="favcolor"><br><br>

            <label for="country">Enter your country:</label>
            <input type="text" name="country" placeholder="Ukraine"><br><br>

            <label for="city">Enter your city:</label>
            <input type="text" name="city" placeholder="Kyiv"><br><br>

            <label for="comment">Enter your comment:</label><br><br>
            <textarea type="text" name="comment" placeholder="Some comment"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </article>
</body>

</html>
